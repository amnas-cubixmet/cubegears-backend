<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:32px 12px;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#152238;">
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;margin:0 auto;background:white;border:1px solid #e0e8f0;border-radius:16px;">
<tr><td style="padding:26px 30px 14px;border-bottom:1px solid #e0e8f0;font-size:19px;font-weight:700;color:#1677ff;">CubixGear</td></tr>
<tr><td style="padding:26px 30px 30px;">
<h1 style="margin:0 0 14px;font-size:22px;line-height:1.3;">{{ subject }}</h1>
<p style="font-size:14px;line-height:1.8;white-space:pre-line;">{{ body }}</p>
<p style="padding:12px 0;"><a href="{{ action_url }}" style="display:inline-block;background:#1677ff;color:white;border-radius:8px;padding:13px 20px;text-decoration:none;font-size:14px;font-weight:700;">{{ action_label }}</a></p>
<p style="font-size:12px;color:#63738a;line-height:1.6;">If the button is not working, copy this address into your browser:</p>
<p style="font-size:12px;overflow-wrap:anywhere;word-break:break-all;"><a href="{{ action_url }}" style="color:#1677ff;">{{ action_url }}</a></p>
<p style="font-size:12px;color:#63738a;line-height:1.6;">If you did not request this email, you can safely ignore it. Never share a sign-in or password link.</p>
</td></tr>
<tr><td style="padding:18px 30px;background:#f8fafc;border-top:1px solid #e0e8f0;font-size:11px;color:#63738a;">CubixGear · Secure account notifications</td></tr>
</table></body></html>
