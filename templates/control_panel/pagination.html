{% if rows.paginator.num_pages > 1 %}
<nav class="toolbar" aria-label="Pagination">
  <span>{{ rows.start_index }}–{{ rows.end_index }} of {{ rows.paginator.count }}</span>
  <div class="row-actions">
    {% if rows.has_previous %}<a class="btn" href="{% querystring page=rows.previous_page_number %}">Previous</a>{% endif %}
    <span>Page {{ rows.number }} of {{ rows.paginator.num_pages }}</span>
    {% if rows.has_next %}<a class="btn" href="{% querystring page=rows.next_page_number %}">Next</a>{% endif %}
  </div>
</nav>
{% endif %}
