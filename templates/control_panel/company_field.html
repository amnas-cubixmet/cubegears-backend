<div class="company-editor-field{% if wide %} is-wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="field-hint">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<span class="field-error" role="alert">{{ error }}</span>{% endfor %}
</div>
