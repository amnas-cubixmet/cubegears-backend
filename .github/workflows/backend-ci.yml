name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt 'ruff==0.17.1'
      - name: Check unused code and duplicate definitions
        run: ruff check . --select F401,F811,F841,F601,F602,F821,F822,F823,F901
      - run: python -m compileall -q apps common config scripts
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - name: Backend regression suite
        run: python manage.py test apps --noinput
      - name: Deployment setup tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Real Redis, Celery worker and Beat integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          python scripts/smoke_celery_worker.py
          python scripts/smoke_runtime_billing.py
