name: Backend CI

# Validates the current full CubixGear backend integration.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python manage.py check
      # Exercise the full migration graph on a fresh SQLite database.
      # Runtime model changes must not ship without their database tables.
      - run: python manage.py migrate --noinput
