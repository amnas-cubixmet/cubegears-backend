name: Backend CI

# Validates the current full CubixGear backend integration.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python manage.py check
      # Validate login security, responsive dashboard templates, and company directory UI.
      - run: python manage.py test apps.control_panel.test_login_ui apps.control_panel.test_csrf_origin apps.control_panel.test_auth_production apps.control_panel.test_company_dashboard_theme apps.control_panel.test_companies_directory_theme apps.control_panel.test_company_editor apps.control_panel.test_users_ui apps.control_panel.test_subscriptions_ui apps.control_panel.test_plans_ui apps.control_panel.test_plan_builder apps.control_panel.test_staff_ui apps.control_panel.test_invoices_ui apps.control_panel.test_stock_ui apps.control_panel.test_jobs_ui apps.control_panel.test_remaining_modules_ui apps.accounts.tests --noinput
      # Guard production secrets setup: idempotent, private, no accidental rotation.
      - run: python -m unittest discover -s tests -p 'test_pythonanywhere_setup.py' -v
      # Verify direct email delivery works without installing Celery.
      - run: python manage.py test apps.accounts.test_rbac_email.DirectEmailTests apps.employees.test_staff_password_onboarding --noinput
      # Exercise the full migration graph on a fresh SQLite database.
      # Runtime model changes must not ship without their database tables.
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test apps.saas.test_storage_events --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py test apps.saas.test_razorpay_checkout --noinput
      - run: python manage.py test apps.payroll.tests apps.payroll.test_daily_wage apps.attendance.test_no_paid_leave apps.jobs.test_outside_labour apps.jobs.test_quick_create apps.jobs.test_workflow apps.jobs.test_workflow_api apps.jobs.test_india_gst apps.invoices.test_india_gst apps.invoices.test_eway_reset_api apps.jobs.test_qc_login apps.jobs.test_cost_summary apps.invoices.test_invoice_pdf apps.jobs.test_outside_part_approval apps.jobs.test_work_photos apps.payments.test_payment_guards apps.inventory.test_stock_operations apps.saas.tests_account apps.saas.test_dynamic_plans --noinput
