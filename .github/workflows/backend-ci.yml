name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "True"
      DB_ENGINE: "django.db.backends.sqlite3"
      DB_NAME: "/tmp/cubegears-ci.sqlite3"
      DB_CONN_MAX_AGE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt 'ruff==0.17.1'
      - name: Check unused code and duplicate definitions
        run: ruff check . --select F401,F811,F841,F601,F602,F821,F822,F823,F901
      - run: python -m compileall -q apps common config scripts
      - run: python manage.py check
      - name: Check billing settings templates compile
        run: python manage.py shell -c "from django.template.loader import get_template; [get_template(name) for name in ['control_panel/billing_settings.html', 'control_panel/_billing_settings_forms.html']]"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - name: Verify live database readiness contract and safe 503 responses
        run: python manage.py test common.tests_readiness --noinput
      - name: Validate JWT session revocation for inactive staff and workshops
        run: python manage.py test apps.accounts.tests_session_revocation apps.accounts.tests_logout --noinput
      - name: Run email, attendance, tenant, billing, and invoice regressions
        run: |
          python manage.py test \
            apps.accounts.tests_email_delivery \
            apps.accounts.tests_owner_permissions \
            apps.roles.tests_granular_permissions \
            apps.employees.tests_staff_assignments \
            apps.payments.tests_reversal \
            apps.payments.tests_customer_credits \
            apps.finance.tests \
            apps.finance.tests_part14 \
            apps.expenses.tests_budgets \
            apps.accounts.tests_mobile_staff_onboarding \
            apps.customers.tests_portal_access \
            apps.customers.tests_branch_assignment \
            apps.customers.tests_directory_summary \
            apps.customers.tests_website \
            apps.customers.tests_part17_estimate_decision \
            apps.notifications.tests \
            apps.reports.tests_workspace \
            apps.vehicles.tests_inspection_photo \
            apps.vehicles.tests_customer_vehicle_workflow \
            apps.jobs.tests_create_vehicle_complaints \
            apps.jobs.tests_part08_job_inspection \
            apps.jobs.tests_manual_complaints \
            apps.jobs.tests_work_skip \
            apps.jobs.tests_estimate_skip_gst \
            apps.jobs.tests_estimate_version_workflow \
            apps.services.tests_hierarchy \
            apps.inventory.tests_supplier_finance \
            apps.inventory.tests_stock_identifiers \
            apps.inventory.tests_part12_stock_ledger \
            apps.inventory.tests_part13_supplier_returns \
            apps.suppliers \
            apps.jobs.tests_inspection_skip \
            apps.whatsapp.tests_integration \
            apps.whatsapp.tests_part19_estimate_notifications \
            apps.search.tests \
            apps.companies.tests_logo_upload \
            apps.companies.tests_onboarding \
            apps.companies.tests_default_subdomains \
            apps.control_panel.tests_feature_pricing_routes \
            apps.control_panel.tests_branding \
            apps.attendance.tests_auto_checkout_scheduler \
            apps.attendance.tests_punch_location \
            apps.attendance.tests_free_self_attendance_salary \
            apps.credits.tests_company_saas_invoices \
            apps.credits.tests_bundle_purchase_throttle \
            apps.credits.tests_storage_interval_monitoring \
            apps.invoices.tests_template_appearance \
            apps.invoices.tests_calculations \
            apps.gstr.tests \
            apps.gstr.tests_part15 \
            apps.gstr.tests_purchase_settlements \
            apps.invoices.tests_job_draft \
            apps.invoices.tests_part10_integrity \
            apps.invoices.tests_part10_document_integrity \
            apps.inventory.tests_supplier_credit \
            --noinput
      - name: Verify production database/worker settings without live secrets
        run: python -m unittest -v config.test_production_settings
      - name: Verify safe SQLite backup prior to migration
        run: python -m unittest discover -s scripts -p 'test_backup_sqlite.py' -v
      # Staging/live broker and SMTP verification must be done on hosting.

  postgresql:
    name: PostgreSQL 16 migrations and finance tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_cubegears
          POSTGRES_PASSWORD: ci-only-not-a-production-password
          POSTGRES_DB: ci_cubegears
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_cubegears -d ci_cubegears"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: "ci_cubegears"
      DB_USER: "ci_cubegears"
      DB_PASSWORD: "ci-only-not-a-production-password"
      DB_CONN_MAX_AGE: "0"
      SERVICE_ROLE: "web"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Check PostgreSQL models and apply all migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
      - name: PostgreSQL finance, supplier and payments regressions
        run: |
          python manage.py test apps.finance.tests apps.finance.tests_part14 apps.expenses.tests_budgets apps.inventory.tests_supplier_finance apps.inventory.tests_part12_stock_ledger apps.inventory.tests_part13_supplier_returns apps.payments.tests_reversal apps.payments.tests_customer_credits apps.companies.tests_onboarding apps.invoices.tests_part10_integrity apps.invoices.tests_part10_document_integrity apps.gstr.tests apps.gstr.tests_part15 --noinput



  docker-image:
    name: Production image build (Django + shared Celery image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image with collected static files
        run: docker build --pull -t cubegears-backend:ci .
      - name: Check compose syntax without any live passwords
        env:
          DB_NAME: ci_cubegears
          DB_USER: ci_cubegears
          DB_PASSWORD: ci-only-not-a-production-password
          REDIS_PASSWORD: ci-only-not-a-production-redis-password
        run: |
          cp .env.production.example .env
          docker compose -f compose.production.yml config --quiet
          rm .env
